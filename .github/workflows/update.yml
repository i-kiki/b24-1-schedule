name: update-calendar

on:
  schedule:
    - cron: "17 */3 * * *"   # каждые 3 часа
  workflow_dispatch:          # ручной запуск из вкладки Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build ics
        run: python build_ics.py
      - name: Commit if changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add ib24-1.ics
          git diff --cached --quiet || (git commit -m "update schedule" && git push)
